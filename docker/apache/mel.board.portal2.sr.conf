<VirtualHost *:80>
    ServerName mel.board.portal2.sr
    Redirect permanent / https://mel.board.portal2.sr/
</VirtualHost>

<VirtualHost *:443>
    ServerName mel.board.portal2.sr
    DocumentRoot "/var/www/html/public"

    <Directory "/var/www/html/public">
        AllowOverride all
        Require all granted
    </Directory>

    Alias "/demos" "/var/www/html/demos"

    <Directory "/var/www/html/demos">
        AllowOverride none
        Require all denied

        <FilesMatch "\.dem$">
            Require all granted
            Header set Content-Type application/octect-stream
        </FilesMatch>
    </Directory>
</VirtualHost>
